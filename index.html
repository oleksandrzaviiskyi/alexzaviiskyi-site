<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alex Zaviiskyi</title>
  <meta name="description" content="A quiet personal space for practice, notes, and Vedic technologies." />
  <style>
    :root {
      --bg: #f7f3ed;
      --text: #181614;
      --muted: #746d64;
      --line: rgba(24, 22, 20, 0.14);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    a { color: inherit; text-decoration: none; }
    .page { min-height: 100vh; display: flex; flex-direction: column; }
    header {
      position: fixed;
      z-index: 10;
      top: 0;
      left: 0;
      width: 100%;
      padding: 28px clamp(22px, 4vw, 64px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      letter-spacing: .02em;
    }
    nav { display: flex; gap: 18px; color: var(--muted); }
    nav a.active { color: var(--text); }
    main { flex: 1; display: grid; grid-template-columns: 1.02fr .98fr; min-height: 100vh; }
    .content {
      padding: 22vh clamp(28px, 7vw, 120px) 12vh clamp(28px, 7vw, 120px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .eyebrow {
      color: var(--muted);
      font-size: 14px;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    h1 {
      margin: 0;
      font-size: clamp(48px, 7vw, 104px);
      line-height: .94;
      letter-spacing: -.06em;
      font-weight: 500;
      max-width: 780px;
    }
    .copy {
      margin-top: 42px;
      max-width: 560px;
      color: var(--muted);
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 350;
    }
    .note {
      margin-top: 72px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      max-width: 420px;
      color: var(--muted);
      font-size: 14px;
    }
    .image {
      min-height: 100vh;
      background: linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.08)), url('') center/cover no-repeat;
      border-left: 1px solid var(--line);
    }
    .image.empty { background: radial-gradient(circle at 50% 45%, rgba(24,22,20,.12), transparent 34%), var(--bg); }
    .loading { opacity: .45; }
    @media (max-width: 820px) {
      header { position: static; }
      main { grid-template-columns: 1fr; }
      .content { padding-top: 10vh; min-height: 72vh; }
      .image { min-height: 42vh; border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="page loading" id="page">
    <header>
      <a href="/">Alex Zaviiskyi</a>
      <nav aria-label="Language">
        <a href="/en/" data-lang-link="en">EN</a>
        <a href="/ru/" data-lang-link="ru">RU</a>
        <a href="/es/" data-lang-link="es">ES</a>
      </nav>
    </header>

    <main>
      <section class="content">
        <div class="eyebrow" id="heroEyebrow">Practice / Notes / Vedic Technologies</div>
        <h1 id="heroTitle">A quiet space for returning to the source of life.</h1>
        <div class="copy" id="heroCopy">Personal practice, group rhythm, and notes on the technologies of consciousness.</div>
        <div class="note" id="heroNote">Content is loading from Sanity.</div>
      </section>
      <section class="image empty" id="heroImage" aria-label="Hero image"></section>
    </main>
  </div>

  <script>
    const SANITY_PROJECT_ID = '0po0panc';
    const SANITY_DATASET = 'production';
    const SANITY_API_VERSION = '2025-05-19';

    const fallback = {
      en: {
        heroEyebrow: 'Practice / Notes / Vedic Technologies',
        heroTitle: 'A quiet space for returning to the source of life.',
        heroCopy: 'Personal practice, group rhythm, and notes on the technologies of consciousness.',
        heroNote: 'Content is managed in Sanity.'
      },
      ru: {
        heroEyebrow: 'Практика / Заметки / Ведические технологии',
        heroTitle: 'Тихое пространство для возвращения к источнику жизни.',
        heroCopy: 'Личная практика, групповое поле и заметки о технологиях сознания.',
        heroNote: 'Контент управляется через Sanity.'
      },
      es: {
        heroEyebrow: 'Práctica / Notas / Tecnologías Védicas',
        heroTitle: 'Un espacio silencioso para volver a la fuente de la vida.',
        heroCopy: 'Práctica personal, ritmo grupal y notas sobre tecnologías de la conciencia.',
        heroNote: 'El contenido se administra en Sanity.'
      }
    };

    function getLang() {
      const firstPath = window.location.pathname.split('/').filter(Boolean)[0];
      return ['en', 'ru', 'es'].includes(firstPath) ? firstPath : 'en';
    }

    function setText(id, value) {
      if (value) document.getElementById(id).textContent = value;
    }

    function imageUrl(source) {
      if (!source || !source.asset || !source.asset._ref) return '';
      const ref = source.asset._ref.replace('image-', '').replace('-jpg', '.jpg').replace('-png', '.png').replace('-webp', '.webp');
      return `https://cdn.sanity.io/images/${SANITY_PROJECT_ID}/${SANITY_DATASET}/${ref}`;
    }

    async function loadHomePage() {
      const lang = getLang();
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-lang-link]').forEach(a => {
        a.classList.toggle('active', a.dataset.langLink === lang);
      });

      const query = `*[_type == "homePage"][0]{
        "heroEyebrow": heroEyebrow[$lang],
        "heroTitle": heroTitle[$lang],
        "heroCopy": heroCopy[$lang],
        "heroNote": heroNote[$lang],
        heroImage
      }`;

      const url = `https://${SANITY_PROJECT_ID}.api.sanity.io/v${SANITY_API_VERSION}/data/query/${SANITY_DATASET}?query=${encodeURIComponent(query)}&$lang=${encodeURIComponent(JSON.stringify(lang))}`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Sanity error ${response.status}`);
        const json = await response.json();
        const data = json.result || fallback[lang];
        render(data, lang);
      } catch (error) {
        console.warn(error);
        render(fallback[lang], lang);
      } finally {
        document.getElementById('page').classList.remove('loading');
      }
    }

    function render(data, lang) {
      setText('heroEyebrow', data.heroEyebrow || fallback[lang].heroEyebrow);
      setText('heroTitle', data.heroTitle || fallback[lang].heroTitle);
      setText('heroCopy', data.heroCopy || fallback[lang].heroCopy);
      setText('heroNote', data.heroNote || fallback[lang].heroNote);

      const img = imageUrl(data.heroImage);
      const el = document.getElementById('heroImage');
      if (img) {
        el.style.backgroundImage = `linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.08)), url('${img}')`;
        el.classList.remove('empty');
      }
    }

    loadHomePage();
  </script>
</body>
</html>
